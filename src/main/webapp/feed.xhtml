<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="jakarta.faces.passthrough">
<f:metadata>
    <f:viewAction action="#{loginBean.checkLogin()}" />
</f:metadata>
<h:head>
    <title>Instagram</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Grand+Hotel&amp;display=swap');
        
        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            padding-bottom: 80px;
        }

        /* Top Header Bar */
        .app-header {
            position: sticky;
            top: 0;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #262626;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            z-index: 1000;
        }

        .header-logo {
            font-family: 'Grand Hotel', cursive;
            font-size: 28px;
            text-decoration: none;
            background: linear-gradient(45deg, #f09433 0%, #dc2743 50%, #bc1888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #000000;
            display: flex;
            justify-content: space-around;
            padding: 0;
            border-top: 1px solid #262626;
            z-index: 1000;
            align-items: center;
        }
        
        .nav-item {
            position: relative;
            text-align: center;
            color: #a1a1aa;
            text-decoration: none;
            font-size: 22px;
            transition: color 0.2s, transform 0.2s;
        }
        .nav-item:hover, .nav-item.active {
            color: #ffffff;
            transform: scale(1.15);
        }

        .badge-dot {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            border: 1.5px solid #000000;
        }

        .feed-container {
            max-width: 500px;
            margin: 10px auto 20px auto;
            padding: 0 10px;
        }

        /* Stories Tray */
        .stories-container {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding: 10px 5px;
            margin-bottom: 15px;
            border-bottom: 1px solid #1c1c1e;
        }

        .stories-container::-webkit-scrollbar {
            display: none;
        }

        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            font-size: 11px;
            color: #a1a1aa;
            min-width: 65px;
        }

        .story-avatar-wrap {
            padding: 2.5px;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            border-radius: 50%;
            display: inline-block;
            margin-bottom: 5px;
            transition: transform 0.2s ease;
        }

        .story-avatar-wrap:hover {
            transform: scale(1.05);
        }

        .story-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #000000;
        }

        /* Post Card */
        .post-card {
            background: #000000;
            border-bottom: 1px solid #1c1c1e;
            padding: 10px 0 20px 0;
            margin-bottom: 15px;
        }

        .post-header {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            padding: 0 5px;
        }

        .post-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            margin-right: 12px;
            object-fit: cover;
            padding: 1.5px;
            background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
        }

        .post-author-link {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            text-decoration: none;
        }

        .post-author-link:hover {
            opacity: 0.8;
        }

        .post-date {
            font-size: 10px;
            color: #71717a;
            margin-top: 2px;
        }

        .post-image-container {
            width: 100%;
            border-radius: 4px;
            overflow: hidden;
            background-color: #121212;
            margin-top: 8px;
            border: 1px solid #1c1c1e;
        }

        .post-image {
            width: 100%;
            display: block;
            object-fit: cover;
            max-height: 500px;
        }

        .post-caption-box {
            padding: 15px 5px 5px 5px;
            font-size: 14.5px;
            line-height: 1.4;
            color: #e4e4e7;
        }

        .post-caption-box strong {
            color: #ffffff;
            margin-right: 6px;
        }

        .badge-type {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            background: #262626;
            color: #a1a1aa;
            font-weight: 500;
            margin-left: 8px;
            vertical-align: middle;
            text-transform: uppercase;
        }

        /* Action Buttons */
        .post-actions {
            display: flex;
            gap: 15px;
            padding: 12px 5px 5px 5px;
            align-items: center;
        }

        .action-btn {
            font-size: 22px;
            cursor: pointer;
            text-decoration: none;
            color: #ffffff;
            transition: transform 0.1s ease;
        }

        .action-btn:hover {
            transform: scale(1.1);
        }

        .likes-count {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            padding: 8px 5px 0 5px;
            display: block;
        }

        /* Comments List */
        .comments-section {
            padding: 5px;
            font-size: 13.5px;
        }

        .comment-item {
            margin-bottom: 6px;
        }

        .comment-item strong {
            color: #ffffff;
            margin-right: 6px;
        }

        /* New Comment Input */
        .comment-box {
            display: flex;
            align-items: center;
            border: 1px solid #262626;
            border-radius: 20px;
            padding: 4px 12px;
            margin-top: 15px;
            background: #121212;
        }

        .comment-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 13px;
            outline: none;
            padding: 8px 0;
            font-family: inherit;
        }

        .comment-submit {
            background: transparent;
            border: none;
            color: #3797f0;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            padding: 0 4px;
            transition: color 0.2s;
        }

        .comment-submit:hover {
            color: #0056b3;
        }

        /* Create Post Area styling */
        .create-post-card {
            background: #121212;
            border: 1px solid #262626;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }
        
        .create-post-textarea {
            width: 100%;
            background: #1c1c1e;
            border: 1px solid #262626;
            border-radius: 8px;
            color: white;
            padding: 12px;
            box-sizing: border-box;
            font-family: inherit;
            resize: none;
            outline: none;
            font-size: 14px;
            margin-bottom: 12px;
        }
        
        .create-post-input {
            width: 100%;
            background: #1c1c1e;
            border: 1px solid #262626;
            border-radius: 8px;
            color: white;
            padding: 10px 12px;
            box-sizing: border-box;
            font-family: inherit;
            outline: none;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .create-post-file {
            width: 100%;
            background: #1c1c1e;
            border: 1px dashed #363636;
            color: #a1a1aa;
            padding: 10px 12px;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            outline: none;
            margin-bottom: 15px;
            transition: border-color 0.2s;
        }
        
        .create-post-file:hover {
            border-color: #a855f7;
        }

        .post-btn {
            background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.2s;
        }

        .post-btn:hover {
            opacity: 0.9;
        }
        
        .dropdown-menu {
            padding: 8px 12px;
            border-radius: 8px;
            background: #1c1c1e;
            color: white;
            border: 1px solid #262626;
            outline: none;
            font-family: inherit;
            font-size: 13px;
        }
    </style>
</h:head>
<h:body>
    <div class="app-header">
        <a href="feed.xhtml" class="header-logo">Instagram</a>
        <div style="display: flex; gap: 18px; align-items: center;">
            <h:link outcome="chat" style="font-size:20px; color:white; text-decoration:none; position:relative;">
                <i class="bi bi-send"></i>
                <h:panelGroup rendered="#{loginBean.hasUnseenMessages}">
                    <span class="badge-dot" style="top:-3px; right:-3px;"></span>
                </h:panelGroup>
            </h:link>
        </div>
    </div>

    <div class="bottom-nav">
        <h:link outcome="feed" styleClass="nav-item active"><i class="bi bi-house-fill"></i></h:link>
        <h:link outcome="chat" styleClass="nav-item">
            <i class="bi bi-chat-dots"></i>
            <h:panelGroup rendered="#{loginBean.hasUnseenMessages}">
                <span class="badge-dot"></span>
            </h:panelGroup>
        </h:link>
        <h:link outcome="people" styleClass="nav-item"><i class="bi bi-person-plus"></i></h:link>
        <h:link outcome="profile" styleClass="nav-item"><i class="bi bi-person"></i></h:link>
    </div>

    <div class="feed-container">
        <!-- Stories Tray -->
        <div class="stories-container">
            <!-- Your Story Item (Instagram UX) -->
            <div class="story-item" style="position:relative;">
                <h:panelGroup rendered="#{feedBean.myStoryActive}">
                    <div class="story-avatar-wrap" onclick="openStoryModal('#{loginBean.currentUser.profilePic}', '#{loginBean.currentUser.username}', '#{feedBean.myActiveStory.caption}', '#{feedBean.myActiveStory.mediaUrl}')" style="cursor:pointer;">
                        <img src="#{loginBean.currentUser.profilePic}" class="story-avatar" onerror="this.src='https://ui-avatars.com/api/?name=#{loginBean.currentUser.username}'" />
                    </div>
                    <div onclick="openCreateStoryModal()" style="position:absolute; bottom:20px; right:5px; background:#3797f0; width:18px; height:18px; border-radius:50%; display:flex; justify-content:center; align-items:center; border:2px solid #000; cursor:pointer; z-index:10;">
                        <i class="bi bi-plus" style="font-size:14px; color:#fff; font-weight:bold;"></i>
                    </div>
                </h:panelGroup>

                <h:panelGroup rendered="#{not feedBean.myStoryActive}">
                    <div class="story-avatar-wrap" onclick="openCreateStoryModal()" style="background:#3f3f46; padding:2px; cursor:pointer;">
                        <img src="#{loginBean.currentUser.profilePic}" class="story-avatar" onerror="this.src='https://ui-avatars.com/api/?name=#{loginBean.currentUser.username}'" />
                    </div>
                    <div onclick="openCreateStoryModal()" style="position:absolute; bottom:20px; right:5px; background:#3797f0; width:18px; height:18px; border-radius:50%; display:flex; justify-content:center; align-items:center; border:2px solid #000; cursor:pointer; z-index:10;">
                        <i class="bi bi-plus" style="font-size:14px; color:#fff; font-weight:bold;"></i>
                    </div>
                </h:panelGroup>
                <span style="max-width: 65px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Your Story</span>
            </div>
            
            <!-- Dynamic Stories (Excluding My Own since it is first) -->
            <ui:repeat value="#{feedBean.activeStories}" var="st">
                <h:panelGroup rendered="#{st.user.userId != loginBean.currentUser.userId}">
                    <div class="story-item" onclick="openStoryModal('#{st.user.profilePic}', '#{st.user.username}', '#{st.caption}', '#{st.mediaUrl}')" style="cursor:pointer;">
                        <div class="story-avatar-wrap">
                            <img src="#{st.user.profilePic}" class="story-avatar" onerror="this.src='https://ui-avatars.com/api/?name=#{st.user.username}'" />
                        </div>
                        <span style="max-width: 65px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">#{st.user.username}</span>
                    </div>
                </h:panelGroup>
            </ui:repeat>
        </div>

        <!-- Create Post / Reel / Story -->
        <h:form id="createPostForm" rendered="#{loginBean.loggedIn}" styleClass="create-post-card" enctype="multipart/form-data">
            <h3 style="margin: 0 0 12px 0; font-size:15px; font-weight:600;">Create</h3>
            <h:inputTextarea value="#{feedBean.newCaption}" styleClass="create-post-textarea" p:placeholder="Write a caption..." rows="2" />
            
            <div style="margin-bottom: 12px;">
                <h:inputText value="#{feedBean.newMediaUrl}" styleClass="create-post-input" p:placeholder="Image/Video URL (optional, e.g. mp4 link for Reels)" style="margin-bottom: 8px;" />
                <div style="display: flex; align-items: center; gap: 8px; justify-content: center; color: #71717a; font-size: 12px; margin-bottom: 8px;">
                    <span style="height: 1px; background: #262626; flex: 1;"></span>
                    <span>OR</span>
                    <span style="height: 1px; background: #262626; flex: 1;"></span>
                </div>
                <h:inputFile value="#{feedBean.uploadedFile}" styleClass="create-post-file" />
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h:selectOneMenu value="#{feedBean.newType}" styleClass="dropdown-menu">
                    <f:selectItem itemValue="post" itemLabel="Post 📸" />
                    <f:selectItem itemValue="reel" itemLabel="Reel 🎬" />
                    <f:selectItem itemValue="story" itemLabel="Story ⭕" />
                </h:selectOneMenu>
                <h:commandButton action="#{feedBean.createPost()}" value="Share" styleClass="post-btn" />
            </div>
        </h:form>

        <h:outputText value="Please login first." rendered="#{not loginBean.loggedIn}" style="display:block; text-align:center; color:#a1a1aa; margin-top:40px;"/>

        <!-- Posts List -->
        <h:form id="feedForm" rendered="#{loginBean.loggedIn}">
            <ui:repeat value="#{feedBean.postViewModels}" var="vmp">
                <div class="post-card">
                    <!-- Post Header -->
                    <div class="post-header">
                        <img src="#{vmp.post.user.profilePic}" class="post-avatar" onerror="this.src='https://ui-avatars.com/api/?name=#{vmp.post.user.username}'" />
                        <div>
                            <h:link outcome="profile" value="#{vmp.post.user.username}" styleClass="post-author-link">
                                <f:param name="userId" value="#{vmp.post.user.userId}" />
                            </h:link>
                            <h:panelGroup rendered="#{vmp.post.type == 'reel'}">
                                <span class="badge-type">Reel</span>
                            </h:panelGroup>
                            <div class="post-date">#{vmp.post.createdAt}</div>
                        </div>
                        <h:panelGroup rendered="#{vmp.post.user.userId == loginBean.currentUser.userId}" style="margin-left: auto; display: flex; align-items: center;">
                            <span onclick="openPostOptionsModal(this)" data-postid="#{vmp.post.postId}" data-caption="#{vmp.post.caption}" data-mediaurl="#{vmp.post.mediaUrl}" style="cursor: pointer; padding: 5px; color: #a1a1aa; font-size: 18px;" title="Post Options">
                                <i class="bi bi-three-dots"></i>
                            </span>
                        </h:panelGroup>
                    </div>
                    
                    <!-- Post Media (Regular Post vs. Reel Video) -->
                    <h:panelGroup rendered="#{not empty vmp.post.mediaUrl}">
                        <div class="post-image-container">
                            <h:panelGroup rendered="#{vmp.post.type == 'reel'}">
                                <video src="#{vmp.post.mediaUrl}" class="post-image" controls="controls" loop="loop" muted="muted" autoplay="autoplay" style="max-height: 600px; width:100%;" />
                            </h:panelGroup>
                            <h:panelGroup rendered="#{vmp.post.type != 'reel'}">
                                <img src="#{vmp.post.mediaUrl}" alt="media" class="post-image" onerror="this.style.display='none'"/>
                            </h:panelGroup>
                        </div>
                    </h:panelGroup>

                    <!-- Action Buttons -->
                    <div class="post-actions">
                        <h:commandLink action="#{feedBean.toggleLike(vmp.post.postId)}" styleClass="action-btn" style="text-decoration:none;">
                            <h:panelGroup rendered="#{vmp.likedByMe}">
                                <i class="bi bi-heart-fill" style="color: #ff3040;"></i>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{not vmp.likedByMe}">
                                <i class="bi bi-heart" style="color: #ffffff;"></i>
                            </h:panelGroup>
                        </h:commandLink>
                        <span class="action-btn"><i class="bi bi-chat" style="color: #ffffff;"></i></span>
                    </div>

                    <!-- Likes Count -->
                    <span class="likes-count">#{vmp.likesCount} likes</span>

                    <!-- Caption -->
                    <div class="post-caption-box">
                        <strong>#{vmp.post.user.username}</strong>#{vmp.post.caption}
                    </div>
                    
                    <!-- Comments section -->
                    <div class="comments-section">
                        <h:panelGroup rendered="#{not empty vmp.comments}">
                            <ui:repeat value="#{vmp.comments}" var="c">
                                <div class="comment-item">
                                    <strong>#{c.user.username}</strong>#{c.content}
                                </div>
                            </ui:repeat>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{empty vmp.comments}">
                            <div style="color:#71717a; font-size:12px; margin-top:5px;">No comments yet.</div>
                        </h:panelGroup>

                        <!-- Add Comment -->
                        <div class="comment-box">
                            <h:inputText value="#{vmp.newComment}" styleClass="comment-input" p:placeholder="Add a comment..."/>
                            <h:commandButton action="#{feedBean.addComment(vmp)}" value="Post" styleClass="comment-submit"/>
                        </div>
                    </div>
                </div>
            </ui:repeat>
        </h:form>
    </div>

    <!-- Instagram Story Modal Overlay -->
    <div id="storyModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:2000; justify-content:center; align-items:center; flex-direction:column;">
        <span onclick="closeStoryModal()" style="position:absolute; top:20px; right:20px; font-size:35px; color:#a1a1aa; cursor:pointer;">&#215;</span>
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:15px; width:100%; max-width:400px; padding:0 10px; box-sizing:border-box;">
            <img id="storyUserPic" src="" style="width:40px; height:40px; border-radius:50%; object-fit:cover; border:2px solid #ffffff;"/>
            <span id="storyUserName" style="font-weight:600; font-size:15px;"></span>
        </div>
        <div style="width:100%; max-width:400px; aspect-ratio:9/16; background:#121212; border-radius:8px; overflow:hidden; display:flex; justify-content:center; align-items:center; border:1px solid #262626; position:relative; box-sizing:border-box;">
            <img id="storyImage" src="" style="width:100%; height:100%; object-fit:cover; display:none;"/>
            <div id="storyTextOnly" style="padding:30px; text-align:center; font-size:20px; font-weight:500; color:#e4e4e7; display:none;"></div>
        </div>
        <div id="storyCaption" style="width:100%; max-width:400px; text-align:center; padding:15px 10px; box-sizing:border-box; color:#e4e4e7; font-size:14px; font-weight:500;"></div>
    </div>
    
    <!-- Create Story Modal Overlay -->
    <div id="createStoryModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:2000; justify-content:center; align-items:center; flex-direction:column;">
        <div style="background:#121212; border:1px solid #262626; padding:25px; border-radius:12px; width:100%; max-width:400px; box-sizing:border-box; position:relative;">
            <span onclick="closeCreateStoryModal()" style="position:absolute; top:15px; right:20px; font-size:25px; color:#a1a1aa; cursor:pointer;">&#215;</span>
            <h3 style="margin-top:0; font-size:18px; font-weight:600; margin-bottom:20px; text-align:center; color:white;">Add to Your Story</h3>
            
            <h:form id="createStoryForm" enctype="multipart/form-data">
                <div style="margin-bottom:15px;">
                    <label style="font-size:12px; color:#a1a1aa; display:block; margin-bottom:6px;">Caption / Text Overlay</label>
                    <h:inputText value="#{feedBean.newCaption}" styleClass="create-post-input" p:placeholder="What's on your mind?" style="margin-bottom:0; width:100%; box-sizing:border-box;"/>
                </div>

                <div style="margin-bottom:15px;">
                    <label style="font-size:12px; color:#a1a1aa; display:block; margin-bottom:6px;">Image/Video URL</label>
                    <h:inputText value="#{feedBean.newMediaUrl}" styleClass="create-post-input" p:placeholder="http://..." style="margin-bottom:0; width:100%; box-sizing:border-box;"/>
                </div>

                <div style="margin-bottom:20px;">
                    <div style="display: flex; align-items: center; gap: 8px; justify-content: center; color: #71717a; font-size: 11px; margin-bottom: 8px;">
                        <span style="height: 1px; background: #262626; flex: 1;"></span>
                        <span>OR UPLOAD FILE</span>
                        <span style="height: 1px; background: #262626; flex: 1;"></span>
                    </div>
                    <h:inputFile value="#{feedBean.uploadedFile}" styleClass="create-post-file" style="margin-bottom:0; width:100%; box-sizing:border-box;"/>
                </div>
                
                <h:commandButton action="#{feedBean.createStory()}" value="Share to Story" styleClass="post-btn" style="width:100%; padding:12px; font-size:14px; font-weight:600; cursor:pointer; background:linear-gradient(45deg, #f09433, #dc2743, #bc1888); border:none; border-radius:8px; color:white;" />
            </h:form>
        </div>
    </div>

    <!-- Edit/Delete Post Modal Overlay -->
    <div id="postOptionsModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:2000; justify-content:center; align-items:center; flex-direction:column;">
        <div style="background:#121212; border:1px solid #262626; padding:25px; border-radius:12px; width:100%; max-width:400px; box-sizing:border-box; position:relative;">
            <span onclick="closePostOptionsModal()" style="position:absolute; top:15px; right:20px; font-size:25px; color:#a1a1aa; cursor:pointer;">&#215;</span>
            <h3 style="margin-top:0; font-size:18px; font-weight:600; margin-bottom:20px; text-align:center; color:white;">Post Options</h3>
            
            <h:form id="postOptionsForm">
                <h:inputHidden id="modalPostId" value="#{feedBean.editPostId}" />
                
                <div style="margin-bottom:15px;">
                    <label style="font-size:12px; color:#a1a1aa; display:block; margin-bottom:6px;">Caption</label>
                    <h:inputTextarea id="modalCaption" value="#{feedBean.editCaption}" styleClass="create-post-textarea" style="margin-bottom:0; width:100%; box-sizing:border-box;" rows="2"/>
                </div>

                <div style="margin-bottom:20px;">
                    <label style="font-size:12px; color:#a1a1aa; display:block; margin-bottom:6px;">Photo/Media URL</label>
                    <h:inputText id="modalMediaUrl" value="#{feedBean.editMediaUrl}" styleClass="create-post-input" style="margin-bottom:0; width:100%; box-sizing:border-box;"/>
                </div>
                
                <div style="display:flex; flex-direction:column; gap:10px;">
                    <h:commandButton action="#{feedBean.updatePost()}" value="Save Changes" styleClass="post-btn" style="width:100%; padding:10px; font-size:14px; font-weight:600; cursor:pointer;" />
                    <h:commandButton action="#{feedBean.deletePost()}" value="Delete Post" styleClass="post-btn" style="width:100%; padding:10px; font-size:14px; font-weight:600; cursor:pointer; background:linear-gradient(45deg, #ef4444, #dc2626); border:none; margin-top:5px;" onclick="return confirm('Are you sure you want to delete this post?');" />
                </div>
            </h:form>
        </div>
    </div>
 
    <script>
        function openStoryModal(pic, name, caption, mediaUrl) {
            document.getElementById('storyUserPic').src = pic ? pic : 'https://ui-avatars.com/api/?name=' + name;
            document.getElementById('storyUserName').innerText = '@' + name;
            
            var img = document.getElementById('storyImage');
            var textOnly = document.getElementById('storyTextOnly');
            
            if (mediaUrl &amp;&amp; mediaUrl.trim() !== '') {
                img.src = mediaUrl;
                img.style.display = 'block';
                textOnly.style.display = 'none';
            } else {
                img.style.display = 'none';
                textOnly.style.display = 'block';
                textOnly.innerText = caption;
            }
            
            document.getElementById('storyCaption').innerText = caption;
            document.getElementById('storyModal').style.display = 'flex';
        }
        
        function closeStoryModal() {
            document.getElementById('storyModal').style.display = 'none';
        }

        function openCreateStoryModal() {
            document.getElementById('createStoryModal').style.display = 'flex';
        }

        function closeCreateStoryModal() {
            document.getElementById('createStoryModal').style.display = 'none';
        }

        function openPostOptionsModal(element) {
            var postId = element.getAttribute('data-postid');
            var caption = element.getAttribute('data-caption');
            var mediaUrl = element.getAttribute('data-mediaurl');
            
            document.getElementById('postOptionsForm:modalPostId').value = postId;
            document.getElementById('postOptionsForm:modalCaption').value = caption;
            document.getElementById('postOptionsForm:modalMediaUrl').value = mediaUrl;
            
            document.getElementById('postOptionsModal').style.display = 'flex';
        }
        
        function closePostOptionsModal() {
            document.getElementById('postOptionsModal').style.display = 'none';
        }
    </script>
</h:body>
</html>
