<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="jakarta.faces.passthrough">
<h:head>
    <title>Instagram - Reset Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Grand+Hotel&amp;display=swap');
        
        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #000000;
            color: #ffffff;
        }

        .forgot-container {
            background: #121212;
            border: 1px solid #262626;
            padding: 40px 35px;
            border-radius: 12px;
            width: 380px;
            text-align: center;
            box-sizing: border-box;
            margin: 20px 0;
        }

        .logo {
            font-family: 'Grand Hotel', cursive;
            font-size: 52px;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #a1a1aa;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #a1a1aa;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .input-field {
            width: 100%;
            padding: 14px 12px;
            border: 1px solid #363636;
            border-radius: 8px;
            background: #1c1c1e;
            color: #fff;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s ease;
        }

        .input-field:focus {
            border-color: #a855f7;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(45deg, #f09433 0%, #dc2743 50%, #bc1888 100%);
            color: #ffffff;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s ease, transform 0.1s ease;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .login-link {
            display: block;
            margin-top: 25px;
            color: #a1a1aa;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .login-link:hover {
            color: #e9d5ff;
        }
        
        .login-link span {
            color: #a855f7;
            font-weight: 600;
        }
    </style>
</h:head>
<h:body>
    <div class="forgot-container">
        <div class="logo">Instagram</div>
        <div class="subtitle">Enter your username and security verification details to reset your password.</div>
        <h:messages globalOnly="true" errorStyle="color: #ef4444;" infoStyle="color: #10b981;" style="margin-bottom: 15px; font-size: 14px; list-style-type: none; padding: 0; text-align: center;" />
        <h:form id="forgotForm">
            <div class="input-group">
                <label>Username *</label>
                <h:inputText id="username" value="#{forgotBean.username}" required="true" requiredMessage="Username is required." styleClass="input-field" p:placeholder="Enter username" />
            </div>
            <div class="input-group">
                <label>Full Name *</label>
                <h:inputText id="fullname" value="#{forgotBean.fullName}" required="true" requiredMessage="Full Name is required." styleClass="input-field" p:placeholder="Enter full name" />
            </div>
            
            <div style="border: 1px dashed #333; border-radius: 8px; padding: 15px 12px; margin-bottom: 15px; background: #0b0b0c;">
                <p style="margin: 0 0 10px 0; font-size: 11px; color: #a1a1aa; line-height: 1.3;">
                    Fill the fields below if they are configured on your profile:
                </p>
                <div class="input-group">
                    <label>Phone Number (optional)</label>
                    <h:inputText id="phone" value="#{forgotBean.phone}" styleClass="input-field" p:type="tel" p:placeholder="e.g. +1234567890" />
                </div>
                <div class="input-group" style="margin-bottom: 0;">
                    <label>Date of Birth (optional)</label>
                    <h:inputText id="dob" value="#{forgotBean.dob}" styleClass="input-field" p:type="date">
                        <f:convertDateTime pattern="yyyy-MM-dd" type="date"/>
                    </h:inputText>
                </div>
            </div>

            <div class="input-group">
                <label>New Password *</label>
                <h:inputSecret id="newPassword" value="#{forgotBean.newPassword}" required="true" requiredMessage="New Password is required." styleClass="input-field" p:placeholder="Enter new password" />
            </div>
            <div class="input-group">
                <label>Confirm Password *</label>
                <h:inputSecret id="confirmPassword" value="#{forgotBean.confirmPassword}" required="true" requiredMessage="Confirm Password is required." styleClass="input-field" p:placeholder="Confirm new password" />
            </div>
            
            <h:commandButton value="Reset Password" action="#{forgotBean.resetPassword()}" styleClass="btn"/>
        </h:form>
        <h:link outcome="index" styleClass="login-link">Back to <span>Log In</span></h:link>
    </div>
</h:body>
</html>
