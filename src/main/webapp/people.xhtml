<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="jakarta.faces.passthrough">
<f:metadata>
    <f:viewAction action="#{loginBean.checkLogin()}" />
</f:metadata>
<h:head>
    <title>Discover People • Instagram</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;display=swap');
        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            background-color: #000000;
            color: #ffffff;
            padding-bottom: 80px;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #000000;
            display: flex;
            justify-content: space-around;
            padding: 0;
            border-top: 1px solid #262626;
            z-index: 1000;
            align-items: center;
        }
        .nav-item {
            position: relative;
            text-align: center;
            color: #a1a1aa;
            text-decoration: none;
            font-size: 22px;
            transition: color 0.2s, transform 0.2s;
        }
        .nav-item:hover, .nav-item.active {
            color: #ffffff;
            transform: scale(1.15);
        }

        .badge-dot {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            border: 1.5px solid #000000;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 0 15px;
            box-sizing: border-box;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
            margin-bottom: 24px;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            color: #71717a;
            font-size: 16px;
        }

        .input-field {
            width: 100%;
            padding: 12px 12px 12px 42px;
            border: 1px solid #262626;
            border-radius: 8px;
            background: #1c1c1e;
            color: white;
            box-sizing: border-box;
            outline: none;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: #3797f0;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin: 24px 0 16px 0;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .cards-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .people-card {
            background: #121212;
            border: 1px solid #262626;
            padding: 16px 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .people-card:hover {
            border-color: #363636;
        }

        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #262626;
        }

        .user-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .user-link {
            display: flex;
            align-items: center;
        }

        .username-link {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            color: white;
        }

        .username-link:hover .fullname {
            color: #3797f0;
        }

        .fullname {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            transition: color 0.2s;
        }

        .username {
            font-size: 12.5px;
            color: #a1a1aa;
        }

        .subtext {
            font-size: 12px;
            color: #71717a;
        }

        .follows-you-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: #a855f7;
            font-weight: 500;
            margin-top: 3px;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-action {
            padding: 8px 16px;
            background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            color: white;
            font-size: 13px;
            transition: opacity 0.2s;
            outline: none;
        }

        .btn-action:hover {
            opacity: 0.9;
        }

        .btn-outline {
            padding: 7px 15px;
            background: #262626;
            border: 1px solid #363636;
            color: white;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
            outline: none;
        }

        .btn-outline:hover {
            background: #363636;
        }
        
        .btn-danger-outline {
            padding: 7px 15px;
            background: transparent;
            border: 1px solid #ef4444;
            color: #ef4444;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s, color 0.2s;
            outline: none;
        }

        .btn-danger-outline:hover {
            background: #ef4444;
            color: white;
        }
    </style>
</h:head>
<h:body>
    <div class="bottom-nav">
        <h:link outcome="feed" styleClass="nav-item"><i class="bi bi-house"></i></h:link>
        <h:link outcome="chat" styleClass="nav-item">
            <i class="bi bi-chat-dots"></i>
            <h:panelGroup rendered="#{loginBean.hasUnseenMessages}">
                <span class="badge-dot"></span>
            </h:panelGroup>
        </h:link>
        <h:link outcome="people" styleClass="nav-item active"><i class="bi bi-person-plus-fill"></i></h:link>
        <h:link outcome="profile" styleClass="nav-item"><i class="bi bi-person"></i></h:link>
    </div>

    <div class="container">
        <h2 style="font-size: 22px; font-weight: 600; margin-bottom: 24px;">Discover People</h2>
        
        <!-- Search Bar -->
        <h:form id="searchForm" styleClass="search-box">
            <i class="bi bi-search search-icon"></i>
            <h:inputText value="#{peopleBean.searchQuery}" styleClass="input-field" p:placeholder="Search by name or username">
                <f:ajax event="keyup" listener="#{peopleBean.search}" render="peopleFormList" />
            </h:inputText>
        </h:form>

        <!-- Main Form wrapper for listings and AJAX triggers -->
        <h:form id="peopleFormList">
            <!-- Follow Requests Section -->
            <h:panelGroup id="requestsPanel" rendered="#{not empty peopleBean.followRequests}">
                <div class="section-title">Follow Requests</div>
                <div class="cards-list">
                    <ui:repeat value="#{peopleBean.followRequests}" var="req">
                        <div class="people-card">
                            <h:link outcome="profile" styleClass="user-link">
                                <f:param name="userId" value="#{req.user.userId}"/>
                                <img src="#{req.user.profilePic}" class="user-avatar" onerror="this.src='https://ui-avatars.com/api/?name=#{req.user.username}'"/>
                            </h:link>
                            <div class="user-info">
                                <h:link outcome="profile" styleClass="username-link">
                                    <f:param name="userId" value="#{req.user.userId}"/>
                                    <span class="fullname">#{req.user.fullName}</span>
                                    <span class="username">@#{req.user.username}</span>
                                </h:link>
                                <h:panelGroup rendered="#{req.incomingStatus == 'pending'}">
                                    <span class="subtext">wants to follow you</span>
                                </h:panelGroup>
                                <h:panelGroup rendered="#{req.incomingStatus == 'accepted'}">
                                    <span class="follows-you-badge"><i class="bi bi-check-circle-fill"></i> Following you</span>
                                </h:panelGroup>
                            </div>
                            <div class="action-buttons">
                                <!-- Pending Request Options -->
                                <h:panelGroup rendered="#{req.incomingStatus == 'pending'}" style="display:flex; gap:8px;">
                                    <h:commandButton action="#{peopleBean.acceptRequest(req.user.userId)}" value="Confirm" styleClass="btn-action">
                                        <f:ajax render="peopleFormList" />
                                    </h:commandButton>
                                    <h:commandButton action="#{peopleBean.declineRequest(req.user.userId)}" value="Delete" styleClass="btn-danger-outline">
                                        <f:ajax render="peopleFormList" />
                                    </h:commandButton>
                                </h:panelGroup>

                                <!-- Accepted Options (Follow Back state) -->
                                <h:panelGroup rendered="#{req.incomingStatus == 'accepted'}" style="display:flex; gap:8px;">
                                    <h:panelGroup rendered="#{req.followStatus == 'accepted'}">
                                        <h:commandButton action="#{peopleBean.toggleFollow(req.user.userId)}" value="Following" styleClass="btn-outline">
                                            <f:ajax render="peopleFormList" />
                                        </h:commandButton>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{req.followStatus == 'pending'}">
                                        <h:commandButton action="#{peopleBean.toggleFollow(req.user.userId)}" value="Requested" styleClass="btn-outline">
                                            <f:ajax render="peopleFormList" />
                                        </h:commandButton>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{req.followStatus == 'none'}">
                                        <h:commandButton action="#{peopleBean.toggleFollow(req.user.userId)}" value="Follow Back" styleClass="btn-action">
                                            <f:ajax render="peopleFormList" />
                                        </h:commandButton>
                                    </h:panelGroup>
                                </h:panelGroup>
                            </div>
                        </div>
                    </ui:repeat>
                </div>
            </h:panelGroup>

            <!-- Suggested / Discover Section -->
            <div class="section-title">Suggested for you</div>
            <h:panelGroup rendered="#{empty peopleBean.discoverPeople}">
                <div style="color: #71717a; text-align: center; padding: 40px 0; font-size: 14px;">No users found</div>
            </h:panelGroup>
            
            <div class="cards-list">
                <ui:repeat value="#{peopleBean.discoverPeople}" var="p">
                    <div class="people-card">
                        <h:link outcome="profile" styleClass="user-link">
                            <f:param name="userId" value="#{p.user.userId}"/>
                            <img src="#{p.user.profilePic}" class="user-avatar" onerror="this.src='https://ui-avatars.com/api/?name=#{p.user.username}'"/>
                        </h:link>
                        <div class="user-info">
                            <h:link outcome="profile" styleClass="username-link">
                                <f:param name="userId" value="#{p.user.userId}"/>
                                <span class="fullname">#{p.user.fullName}</span>
                                <span class="username">@#{p.user.username}</span>
                            </h:link>
                            <h:panelGroup rendered="#{p.followsMe}">
                                <span class="follows-you-badge"><i class="bi bi-arrow-left-right"></i> Follows you</span>
                            </h:panelGroup>
                        </div>
                        <div class="action-buttons">
                            <!-- Following State -->
                            <h:panelGroup rendered="#{p.followStatus == 'accepted'}">
                                <h:commandButton action="#{peopleBean.toggleFollow(p.user.userId)}" value="Following" styleClass="btn-outline">
                                    <f:ajax render="peopleFormList" />
                                </h:commandButton>
                            </h:panelGroup>
                            
                            <!-- Requested State -->
                            <h:panelGroup rendered="#{p.followStatus == 'pending'}">
                                <h:commandButton action="#{peopleBean.toggleFollow(p.user.userId)}" value="Requested" styleClass="btn-outline">
                                    <f:ajax render="peopleFormList" />
                                </h:commandButton>
                            </h:panelGroup>
                            
                            <!-- None State (Choose Follow or Follow Back) -->
                            <h:panelGroup rendered="#{p.followStatus == 'none'}">
                                <h:commandButton action="#{peopleBean.toggleFollow(p.user.userId)}" value="#{p.followsMe ? 'Follow Back' : 'Follow'}" styleClass="btn-action">
                                    <f:ajax render="peopleFormList" />
                                </h:commandButton>
                            </h:panelGroup>
                        </div>
                    </div>
                </ui:repeat>
            </div>
        </h:form>
    </div>
</h:body>
</html>
